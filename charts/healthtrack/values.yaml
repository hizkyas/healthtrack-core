# HealthTrack Helm Chart — Default Values

# -- Number of pod replicas
replicaCount: 2

image:
  # -- Container image repository
  repository: nginx
  # -- Image tag (use "stable" in production)
  tag: "latest"
  # -- Image pull policy
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  name: "web-app-sa"
  automountServiceAccountToken: false
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  # -- Service type: ClusterIP | NodePort | LoadBalancer
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  # -- Enable HorizontalPodAutoscaler
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  # -- Enable PodDisruptionBudget
  enabled: true
  minAvailable: 1

ingress:
  # -- Enable Ingress resource
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: healthtrack.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: healthtrack-tls
      hosts:
        - healthtrack.example.com

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10

networkPolicy:
  # -- Enable NetworkPolicy (deny-all + web-app allow rules)
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
