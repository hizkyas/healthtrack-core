apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: sample-app
  labels:
    app: web-app
    app.kubernetes.io/part-of: healthtrack
  annotations:
    # cert-manager: auto-provision TLS certificate from Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NGINX: force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # NGINX: enable gzip compression
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    # NGINX: proxy buffer settings for performance
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - healthtrack.example.com
    secretName: healthtrack-tls-cert
  rules:
  - host: healthtrack.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port:
              number: 80
