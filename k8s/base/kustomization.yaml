apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Note: namespace.yaml is applied separately (kubectl apply -f k8s/base/namespace.yaml)
# because kustomize's namespace field conflicts with Namespace resources.

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - postgres/secret.yaml
  - postgres/pvc.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml

namespace: sample-app

labels:
  - pairs:
      app.kubernetes.io/part-of: healthtrack
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
