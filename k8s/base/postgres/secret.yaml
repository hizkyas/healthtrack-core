apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: sample-app
  labels:
    app: postgres
    app.kubernetes.io/part-of: healthtrack
type: Opaque
stringData:
  # Change these values before deploying to production!
  POSTGRES_DB: healthtrack
  POSTGRES_USER: healthtrack_user
  POSTGRES_PASSWORD: changeme_use_a_secret_manager_in_prod
  POSTGRES_HOST: postgres-service
  POSTGRES_PORT: "5432"
  # Connection string for application use
  DATABASE_URL: postgresql://healthtrack_user:changeme_use_a_secret_manager_in_prod@postgres-service:5432/healthtrack
