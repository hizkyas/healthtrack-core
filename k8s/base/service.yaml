apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: sample-app
  labels:
    app: web-app
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: healthtrack
spec:
  type: ClusterIP
  ports:
